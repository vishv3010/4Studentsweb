    <script>
      // Decodes the path 404.html encoded before React Router mounts, so a
      // direct hit on /support (etc.) ends up rendering the real page instead
      // of getting stuck on "/" after the redirect.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
